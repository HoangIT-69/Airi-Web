name: deploy

# Builds AIRI from its own repo and deploys:
#   AWS        — api/auth images → ECR, CDK stacks, `deploy.sh` on the EC2 instance via SSM
#   Cloudflare — stage-web → Worker static assets (+ R2 for files over 25 MiB)
# AWS auth is GitHub OIDC (no long-lived keys). Setup: docs/infra/architecture.md.
#
# Repo variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, AIRI_REPOSITORY, AIRI_REF, PUBLIC_URL, CLOUDFLARE_ACCOUNT_ID
# Repo secrets:   CLOUDFLARE_API_TOKEN

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  APP_STACK: airi-web-app
  REGISTRY_STACK: airi-web-registry
  R2_BUCKET: airi-web-large-assets
  CDK_CONTEXT: >-
    -c region=${{ vars.AWS_REGION }}
    -c publicUrl=${{ vars.PUBLIC_URL }}
    -c githubRepo=${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AIRI source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AIRI_REPOSITORY }}
          ref: ${{ vars.AIRI_REF }}
          path: airi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Quality gate (infra + edge)
        run: |
          for DIR in infra edge; do
            (cd "$DIR" && pnpm install --frozen-lockfile && pnpm lint && pnpm test)
          done

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy registry stack
        working-directory: infra
        run: pnpm exec cdk deploy "$REGISTRY_STACK" --require-approval never $CDK_CONTEXT

      - name: Build and push images
        id: images
        run: |
          set -euo pipefail
          TAG="$(git -C airi rev-parse --short=12 HEAD)"
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for SERVICE in api auth; do
            REPO="airi-web/${SERVICE}"
            # Tags are immutable: skip services already built for this AIRI commit.
            if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "${REPO}:${TAG} already exists"
              continue
            fi
            docker build -f "airi/server/apps/${SERVICE}/Dockerfile" -t "${REGISTRY}/${REPO}:${TAG}" airi
            docker push "${REGISTRY}/${REPO}:${TAG}"
          done
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy app stack
        working-directory: infra
        run: >-
          pnpm exec cdk deploy "$APP_STACK" --require-approval never --exclusively
          $CDK_CONTEXT -c imageTag=${{ steps.images.outputs.tag }}

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks --stack-name "$APP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "instance=$(output InstanceId)" >> "$GITHUB_OUTPUT"
          echo "origin=$(output OriginUrl)" >> "$GITHUB_OUTPUT"

      - name: Restart services on EC2
        env:
          INSTANCE_ID: ${{ steps.outputs.outputs.instance }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "airi-web deploy ${{ steps.images.outputs.tag }}" \
            --parameters 'commands=["bash /opt/airi/deploy.sh"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [[ "$STATUS" != "Success" ]]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

      - name: Build stage-web
        working-directory: airi
        env:
          VITE_SERVER_URL: ${{ vars.PUBLIC_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web

      - name: Deploy Cloudflare Worker
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -rf dist large
          cp -r ../airi/apps/stage-web/dist dist
          node scripts/split-large-assets.ts dist large src/large-assets.json
          if [[ -d large ]]; then
            (cd large && find . -type f | sed 's#^\./##') | while read -r KEY; do
              pnpm exec wrangler r2 object put "${R2_BUCKET}/${KEY}" --file "large/${KEY}" --remote
            done
          fi
          pnpm exec wrangler deploy --var "ORIGIN_URL:${{ steps.outputs.outputs.origin }}"
